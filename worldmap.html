:root{color-scheme:dark;--bg:#0b1113;--surface:#162024;--surface2:#1d292a;--line:#354445;--gold:#c6a979;--text:#f4efe6;--dim:#a8b3b0;--blue:#8ac9ee}

.wrap{max-width:1140px;margin:auto;padding:28px 20px 80px}.masthead{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:27px}.overline{font-size:11px;letter-spacing:.23em;font-weight:750;color:var(--gold)}h1{font-size:clamp(25px,5vw,39px);margin:7px 0;font-weight:750;letter-spacing:.025em}h2{font-size:19px;margin:0 0 17px}p{line-height:1.65}.sub{color:var(--dim);font-size:13px}.return{border:1px solid #876e49;text-decoration:none;border-radius:9px;padding:10px 14px;color:#e5c994;font-size:13px}.return:hover{background:#292b25}.panel{background:linear-gradient(145deg,#192725,#141d20);border:1px solid var(--line);border-radius:16px;padding:21px;min-width:0}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{background:#202d2c;border:1px solid #40514c;border-radius:12px;padding:17px;min-width:0}.stat small{display:block;color:var(--dim);font-size:12px;margin-bottom:8px}.stat strong{font-size:clamp(20px,3vw,30px);color:#e9d0a0;overflow-wrap:anywhere}.stat span{display:block;font-size:11px;color:var(--dim);margin-top:5px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.section{margin-top:15px}.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.filterbar label{color:var(--dim);font-size:12px}.filterbar select,.filterbar button,.filelabel{background:#202c2d;border:1px solid #62716c;color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px}.filterbar select{max-width:100%}.filterbar button:hover,.filelabel:hover{border-color:var(--gold)}.hint{color:var(--dim);font-size:12px;line-height:1.7}.barrow{display:grid;grid-template-columns:minmax(92px,150px) minmax(0,1fr) 52px;gap:10px;align-items:center;margin:10px 0;font-size:12px}.barrow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:10px;background:#33413f;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#967343,#e2bf79);border-radius:20px}.count{text-align:right;color:#ebd5ad;font-variant-numeric:tabular-nums}.empty{color:var(--dim);padding:20px;text-align:center}.pill{border:1px solid #7a674a;border-radius:24px;padding:5px 10px;color:#e1c99c;font-size:11px;display:inline-flex;align-items:center}.list{max-height:330px;overflow:auto;display:grid;gap:7px}.bottlerow{padding:12px;border:1px solid #344543;background:#1b2929;border-radius:9px;display:flex;justify-content:space-between;gap:12px;align-items:center}.bottlerow b{font-size:13px;font-weight:650}.bottlerow small{display:block;color:var(--dim);font-size:11px;line-height:1.6}.bottlerow .price{white-space:nowrap;font-size:12px;color:var(--gold)}.foot{border-top:1px solid var(--line);margin-top:30px;padding-top:20px;color:var(--dim);font-size:11px}.filelabel input{display:none}.error{color:#f3ad95}.action{border:1px solid #927546;color:#f5dbac;background:#322b1e;border-radius:8px;padding:8px 11px;font-size:12px}.action:hover{background:#473722}.mono{font-variant-numeric:tabular-nums}@media(max-width:750px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.wrap{padding:22px 13px 50px}.panel{padding:15px}}@media(max-width:390px){.barrow{grid-template-columns:90px minmax(0,1fr) 36px;gap:5px}.stat{padding:12px}}

function render(){const prev=$('category').value;const cats=[...new Set(allItems.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));$('category').innerHTML='<option value="all">すべての酒類</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');if(cats.includes(prev))$('category').value=prev;
const origins=countBy(filtered(),'country');if(currentCountry&&!origins.some(x=>x[0]===currentCountry)){currentCountry=null;currentRegion=null}if(!currentCountry)currentCountry=origins[0]?.[0]||null;
$('country-links').innerHTML=origins.map(([c,n])=>`<button class="country-btn ${c===currentCountry?'active':''}" type="button" data-origin="${esc(c)}">${esc(c)} · ${fmt(n)}</button>`).join('')||'<span class="hint">該当データなし</span>';
$('country-links').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.origin)));
const markers=$('markers');markers.replaceChildren();origins.forEach(([name,n])=>{if(!centers[name])return;const [lon,lat]=centers[name],x=(lon+180)/360*1000,y=(90-lat)/180*490;const r=Math.max(8,Math.min(17,7+Math.sqrt(n)*.75));const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','marker'+(name===currentCountry?' active':''));g.setAttribute('transform',`translate(${x},${y})`);g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',`${name} ${n}銘柄`);g.innerHTML=`<circle r="${r}"></circle><text y="3.7">${n}</text><title>${esc(name)}: ${n} 銘柄</title>`;g.addEventListener('click',e=>{e.stopPropagation();pick(name)});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(name)}});markers.append(g)});
// Natural Earth outlines are geographic background; markers and country buttons are the selection interface.
$('world-svg').querySelectorAll('.land').forEach(p=>p.classList.remove('active'));renderDetail()}
function pick(c){currentCountry=c;currentRegion=null;render()}
function renderDetail(){const a=filtered().filter(x=>x.country===currentCountry);$('country-title').textContent=currentCountry||'—';$('country-note').textContent=currentCountry?'登録された生産国・地域の表記を使用':'産地を選択してください';$('country-summary').innerHTML=`<span class="badge">${fmt(a.length)} 銘柄</span><span class="badge">所持 ${fmt(a.filter(owned).length)}</span><span class="badge">蒸留所等 ${fmt(new Set(a.map(x=>x.distillery).filter(Boolean)).size)}</span>`;
const regions=countBy(a,'region');$('region-items').innerHTML='<div class="regionlist">'+regions.map(([reg,n])=>`<div class="region"><button type="button" data-region="${esc(reg)}">${esc(reg)}</button><span class="count" style="float:right">${n}</span></div>`).join('')+'</div>';
$('show-country-bottles').textContent=currentCountry==='日本'?'日本全体をみる':(currentCountry||'産地')+'全体をみる';
$('region-items').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{currentRegion=b.dataset.region;renderDetail();openBottleDialog()}));
const rows=currentRegion?a.filter(x=>(x.region||'未設定')===currentRegion):a;
$('region-items').querySelectorAll('.region').forEach(box=>{if(box.querySelector('button').dataset.region===currentRegion)box.style.borderColor='#dfbd83'});

// Right panel lists regions only. Open a centered dialog when a region is chosen.
}
function openBottleDialog(){
 const a=filtered().filter(x=>x.country===currentCountry);
 const rows=currentRegion?a.filter(x=>(x.region||'未設定')===currentRegion):a;
 $('dialog-title').textContent=(currentRegion||currentCountry||'産地')+' の銘柄一覧';
 $('dialog-info').textContent=fmt(rows.length)+' 銘柄 · '+(currentCountry||'');
 $('dialog-bottles').innerHTML=rows.map(x=>`<div class="bottlemini">${esc(x.name)}<small>${esc(x.region)} / ${esc(x.distillery)} · ${owned(x)?'所持':'未所持'}${x.favorite?' · ★殿堂入り':''}</small></div>`).join('')||'<p class="empty">該当する銘柄はありません</p>';
 $('dialog-bottles').scrollTop=0;
 $('bottle-dialog').showModal();
}
$('show-country-bottles').addEventListener('click',()=>{currentRegion=null;renderDetail();openBottleDialog()});
$('dialog-close').addEventListener('click',()=>$('bottle-dialog').close());
$('bottle-dialog').addEventListener('click',e=>{if(e.target===$('bottle-dialog'))$('bottle-dialog').close()});
// Zoom is scoped to the SVG viewBox, avoiding layout shifts and focus scrolling.
const mapSvg=$('world-svg'),originalView=[0,0,1000,490];let zoomLevel=1,centerX=500,centerY=245;
function updateZoom(){const w=1000/zoomLevel,h=490/zoomLevel;centerX=Math.max(w/2,Math.min(1000-w/2,centerX));centerY=Math.max(h/2,Math.min(490-h/2,centerY));mapSvg.setAttribute('viewBox',`${centerX-w/2} ${centerY-h/2} ${w} ${h}`);}
function setZoom(z){zoomLevel=Math.min(5,Math.max(1,z));updateZoom();}
$('zoom-in').addEventListener('click',()=>setZoom(zoomLevel*1.4));
$('zoom-out').addEventListener('click',()=>setZoom(zoomLevel/1.4));
$('zoom-reset').addEventListener('click',()=>{centerX=500;centerY=245;setZoom(1)});
mapSvg.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)return;e.preventDefault();setZoom(zoomLevel*(e.deltaY<0?1.15:1/1.15))},{passive:false});
// Unified pointer gestures: one finger pans, two fingers pinch and pan.
// Mouse dragging is supported by the same handlers. All changes stay inside the SVG viewBox.
const activePointers=new Map();
let gestureStart=null, gestureMoved=false, suppressMarkerClickUntil=0;
function gestureMetrics(){
  const a=[...activePointers.values()];
  if(!a.length)return null;
  const x=a.reduce((sum,p)=>sum+p.x,0)/a.length;
  const y=a.reduce((sum,p)=>sum+p.y,0)/a.length;
  const distance=a.length>=2?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;
  return {x,y,distance,count:a.length};
}
function resetGestureBaseline(){gestureStart=gestureMetrics();}
mapSvg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  // Capture on the original target, so a normal tap on a marker remains clickable.
  try{e.target.setPointerCapture(e.pointerId)}catch(_){/* unsupported target */}
  if(activePointers.size===1)gestureMoved=false;
  if(activePointers.size>=2){gestureMoved=true;suppressMarkerClickUntil=Date.now()+500;}
  resetGestureBaseline();
});
mapSvg.addEventListener('pointermove',e=>{
  if(!activePointers.has(e.pointerId))return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const next=gestureMetrics(),prev=gestureStart;
  if(!prev||!next)return;
  const box=mapSvg.getBoundingClientRect();
  if(!box.width||!box.height)return;
  const dx=next.x-prev.x,dy=next.y-prev.y;
  const ratio=(next.count>=2&&prev.count>=2&&prev.distance>0)?next.distance/prev.distance:1;
  const oldZoom=zoomLevel;
  const newZoom=Math.max(1,Math.min(5,oldZoom*ratio));
  // Keep the previous fingers' midpoint anchored on its map coordinate.
  const anchorX=centerX+(prev.x-box.left-box.width/2)/box.width*(1000/oldZoom);
  const anchorY=centerY+(prev.y-box.top-box.height/2)/box.height*(490/oldZoom);
  centerX=anchorX-(next.x-box.left-box.width/2)/box.width*(1000/newZoom);
  centerY=anchorY-(next.y-box.top-box.height/2)/box.height*(490/newZoom);
  zoomLevel=newZoom;
  if(Math.abs(dx)>1||Math.abs(dy)>1||Math.abs(ratio-1)>0.002){
    gestureMoved=true;suppressMarkerClickUntil=Date.now()+500;
  }
  updateZoom();
  gestureStart=next;
  if(e.cancelable)e.preventDefault();
});
function endMapPointer(e){
  if(!activePointers.has(e.pointerId))return;
  activePointers.delete(e.pointerId);
  resetGestureBaseline();
  if(activePointers.size===0)gestureMoved=false;
}
mapSvg.addEventListener('pointerup',endMapPointer);
mapSvg.addEventListener('pointercancel',endMapPointer);
mapSvg.addEventListener('lostpointercapture',endMapPointer);
// A pinch or a drag should never accidentally select a country marker.
mapSvg.addEventListener('click',e=>{
  if(e.target.closest('.marker')&&Date.now()<suppressMarkerClickUntil){
    e.preventDefault();e.stopImmediatePropagation();
  }
},true);
['scope','category'].forEach(id=>$(id).addEventListener('change',render));loadData();
