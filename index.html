  <style>
   :root {
	color-scheme:dark;
	--bg:#0b1113;
	--card:#162024;
	--gold:#c6a979;
	--text:#f4efe6;
	--dim:#adb2b0;
	--line:#334044;
	font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',system-ui,sans-serif
}

* {
	box-sizing:border-box
}

body {
	margin:0;
	background:var(--bg);
	color:var(--text)
}

header {
	background:radial-gradient(ellipse at 88% 20%,#36504c 0,transparent 50%),linear-gradient(120deg,#101819,#1e2b2c);
	padding:30px;
	border-bottom:1px solid var(--line)
}

.brand,main {
	max-width:940px;
	margin:auto
}

.overline,.section-kicker {
	font:600 11px system-ui,sans-serif;
	letter-spacing:.24em;
	color:var(--gold)
}

h1 {
	font-size:clamp(28px,6vw,47px);
	font-weight:500;
	letter-spacing:.06em;
	margin:0 0 0
}

h1 span {
	font-size:.30em;
	color:var(--gold)
}

.brand p,.muted {
	color:var(--dim);
	font-size:14px
}

main {
	padding:30px 18px 65px
}

.hero {
	position:relative;
	padding:clamp(24px,5vw,46px);
	border:1px solid #536055;
	background:linear-gradient(140deg,#283633,#131d20);
	border-radius:18px;
	box-shadow:0 14px 35px #0004
}

.hero-top {
	display:flex;
	justify-content:space-between;
	gap:10px;
	align-items:center
}

#today-date {
	font:12px system-ui;
	color:var(--dim)
}

.eyebrow {
	font:14px system-ui;
	color:#e2d7bd;
	margin-top:42px
}

.hero h2 {
	font-size:clamp(27px,5vw,48px);
	font-weight:500;
	margin:5px 0 10px
}

.feature-copy {
	line-height:1.9;
	max-width:620px;
	font-size:15px
}

.serve {
	color:#ddc69d;
	font-size:13px;
	line-height:1.7
}

.pills {
	display:flex;
	gap:7px;
	flex-wrap:wrap
}

.pill {
	font:12px system-ui;
	border:1px solid #69716a;
	border-radius:24px;
	padding:5px 10px;
	color:#e7ddd0
}

.subtle-btn {
	margin-top:20px;
	background:transparent;
	color:var(--gold);
	border:1px solid #9c865f;
	border-radius:9px;
	padding:10px 16px;
	cursor:pointer
}

.catalog {
	margin-top:54px
}

.section-heading {
	display:flex;
	justify-content:space-between;
	align-items:end
}

.section-heading h2 {
	font-size:28px;
	font-weight:500;
	margin:9px 0 20px
}

.count {
	font:13px system-ui;
	color:var(--dim);
	padding-bottom:23px
}

.filters {
	display:grid;
	gap:12px;
	margin-bottom:24px
}

.searchbox {
	display:flex;
	align-items:center;
	border:1px solid var(--line);
	border-radius:10px;
	background:#182225;
	padding:0 14px
}

.searchbox span {
	font-size:22px;
	color:var(--gold)
}

input,select {
	background:transparent;
	color:var(--text);
	border:0;
	font:14px system-ui;
	outline:0
}

input {
	padding:16px 12px;
	width:100%
}

.select-row {
	display:flex;
	gap:10px;
	flex-wrap:wrap
}

.select-row label {
	border:1px solid var(--line);
	padding:10px;
	border-radius:9px;
	color:var(--dim);
	font:12px system-ui
}

select {
	margin-left:8px;
	max-width:175px
}

option {
	background:#182225
}

.cards {
	display:grid;
	grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
	gap:13px
}

.bottle {
	display:block;
	text-align:left;
	width:100%;
	background:var(--card);
	border:1px solid var(--line);
	border-radius:12px;
	padding:20px;
	min-height:158px;
	color:var(--text);
	cursor:pointer
}

.bottle:hover,.bottle:focus-visible {
	border-color:var(--gold)
}

.bottle .mini {
	font:11px system-ui;
	letter-spacing:.08em;
	color:var(--gold)
}

.bottle strong {
	display:block;
	font-size:18px;
	font-weight:500;
	margin:13px 0
}

.bottle .desc {
	font:12px system-ui;
	color:var(--dim);
	line-height:1.7
}

.bottle .go {
	float:right;
	color:var(--gold)
}

dialog {
	background:#172125;
	color:var(--text);
	border:1px solid #7d725d;
	border-radius:14px;
	width:min(92vw,590px);
	max-height:85vh;
	padding:30px
}

dialog::backdrop {
	background:#000b
}

.dialog-close {
	float:right;
	background:transparent;
	border:0;
	color:var(--text);
	font-size:20px;
	cursor:pointer
}

.detail-title {
	font-size:28px;
	font-weight:500;
	margin:14px 0
}

dt {
	color:var(--gold);
	font:12px system-ui;
	margin-top:19px
}

dd {
	margin:6px 0;
	font-size:14px;
	line-height:1.8
}

footer {
	text-align:center;
	border-top:1px solid var(--line);
	padding:30px 12px;
	color:#a69a83;
	font-size:12px;
	letter-spacing:.08em;
	line-height:2
}

footer span {
	font:11px system-ui;
	color:#778181
}

@media(max-width:500px) {
	header {
		padding-top:40px
	}
	.hero {
		padding:24px
	}
	.cards {
		grid-template-columns:1fr
	}
	.eyebrow {
		margin-top:28px
	}
}

h1,.hero h2,.section-heading h2,.bottle strong,.detail-title {
	font-weight:777
}

button,input,select {
	font-family:inherit
}

/* v3: compact catalog + visible liquor categories */
.cards {
	grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
	gap:9px
}

.bottle {
	min-height:112px;
	padding:13px 12px;
	border-radius:9px;
	display:flex;
	flex-direction:column;
	align-items:flex-start;
	gap:7px
}

.bottle strong {
	font-size:14px;
	font-weight:650;
	line-height:1.45;
	margin:0;
	overflow-wrap:anywhere
}

.bottle .mini {
	font-size:10px;
	line-height:1.4;
	letter-spacing:0;
	color:var(--dim)
}

.bottle .desc {
	font-size:11px;
	line-height:1.45;
	display:-webkit-box;
	-webkit-line-clamp:2;
	-webkit-box-orient:vertical;
	overflow:hidden
}

.bottle .bottle-top {
	display:flex;
	width:100%;
	align-items:center;
	gap:6px;
	flex-wrap:wrap
}

.bottle .go {
	float:none;
	margin-left:auto;
	font-size:12px
}

.kind {
	display:inline-flex;
	align-items:center;
	border-radius:5px;
	padding:3px 6px;
	font-size:10px;
	font-weight:750;
	letter-spacing:.02em;
	border:1px solid transparent
}

.kind-whisky {
	background:#503b26;
	color:#ffe0aa;
	border-color:#795c38
}

.kind-gin {
	background:#224c46;
	color:#b4f3dc;
	border-color:#367367
}

.kind-umeshu {
	background:#543548;
	color:#ffc8e4;
	border-color:#845570
}

.kind-shochu {
	background:#293f60;
	color:#d1e5ff;
	border-color:#46618b
}

.kind-liqueur {
	background:#513a60;
	color:#ead4ff;
	border-color:#79548d
}

.kind-other {
	background:#3b4147;
	color:#e1e7ec;
	border-color:#616c75
}

@media(max-width:500px) {
	.cards {
		grid-template-columns:repeat(2,minmax(0,1fr));
		gap:8px
	}
	.bottle {
		min-height:119px;
		padding:11px 10px
	}
	.bottle strong {
		font-size:13px
	}
	.bottle .desc {
		font-size:10px
	}
}

/* v4: highlight alternate recommendation without changing button geometry */
.subtle-btn {
	background:linear-gradient(135deg,#b48b47,#e1be76);
	color:#18201c;
	border-color:#e8cb8e;
	font-weight:750;
	box-shadow:0 0 0 1px #ad884855,0 3px 12px #0004;
	transition:filter .15s ease,box-shadow .15s ease
}

.subtle-btn:hover,.subtle-btn:focus-visible {
	filter:brightness(1.13);
	box-shadow:0 0 0 2px #e1be7666,0 4px 16px #0006
}

/* v5 additive controls; v4 palette and dimensions retained */
.stats {
	display:flex;
	flex-wrap:wrap;
	align-items:center;
	gap:6px;
	margin:12px 0 15px;
	font-size:11px;
	color:var(--dim)
}

.stats span {
	background:#1b292b;
	border:1px solid var(--line);
	border-radius:6px;
	padding:5px 9px
}

.stats b {
	color:var(--gold);
	font-weight:750
}

.stats-total {
	color:var(--text)!important;
	font-weight:700
}

.extra-filters {
	display:flex;
	gap:12px;
	align-items:center;
	flex-wrap:wrap;
	margin-top:10px
}

.extra-filters label {
	font-size:12px;
	color:var(--dim)
}

.extra-filters select {
	margin-left:7px
}

.fav-label {
	display:inline-flex;
	align-items:center;
	gap:5px;
	cursor:pointer
}

.fav-label input {
	accent-color:#dcb46a
}

.bottle {
	cursor:pointer
}

.fav-toggle {
	margin-left:auto;
	font-size:20px;
	line-height:1;
	color:#9da7a2;
	border:0;
	background:none;
	padding:0 3px;
	cursor:pointer
}

.fav-toggle.is-favorite {
	color:#e4b85f
}

.bottle .go {
	margin-left:0
}

.fav-toggle:hover,.fav-toggle:focus-visible {
	color:#e6bf70
}

.detail-favorite {
	border:1px solid #ae8d50;
	border-radius:6px;
	background:#332c1d;
	color:#f1d39a;
	padding:7px 12px;
	margin:0 0 18px;
	cursor:pointer;
	font-weight:650
}

.detail-favorite[aria-pressed=true] {
	background:#574323
}

.bottle:focus-visible {
	outline:2px solid var(--gold);
	outline-offset:2px
}

/* v6: minimal name-only cards; category color stays visible */
.bottle {
	min-height:77px;
	gap:8px;
	justify-content:flex-start
}

.bottle strong {
	margin:0
}

.bottle .go {
	margin-left:auto
}

@media(max-width:500px) {
	.bottle {

/* Switch between compact grid and one bottle per row */

	color:var(--dim);
	font-size:12px
}

.view-switch {
	border:1px solid var(--line);
	border-radius:8px;
	padding:7px 12px;
	background:var(--card);
	color:var(--dim);
	cursor:pointer;
	font-size:12px
}

.view-switch.is-active {
	border-color:var(--gold);
	color:#f1d39a;
	background:#332c1d
}

.view-switch:focus-visible {
	outline:2px solid var(--gold);
	outline-offset:2px
}

.cards.list-view {
	grid-template-columns:minmax(0,1fr);
	gap:7px
}

.cards.list-view .bottle {
	min-height:0;
	padding:10px 13px;

	align-items:center;
	gap:14px
}

	width:auto;
	order:1;
	flex-shrink:0
}

.cards.list-view .bottle strong {
	order:2;
	flex:1
}

.cards.list-view .bottle .go {
	display:none
}

/* Roulette feel in recommendation only, no alteration to surrounding layout */
.hero.is-rolling #today-title {
	animation:roulette-pulse .18s ease-in-out infinite alternate
}

.subtle-btn:disabled {
	opacity:.85;
	cursor:wait
}

@keyframes roulette-pulse {
	from {
		opacity:.48;
		transform:translateY(-2px)
	}
	to {
		opacity:1;
		transform:translateY(2px)
	}
}

.confetti-layer {
	position:absolute;
	inset:0;
	overflow:hidden;
	pointer-events:none;
	border-radius:inherit
}

.confetti-piece {
	position:absolute;
	top:49%;
	left:50%;
	width:7px;
	height:12px;
	border-radius:1px;
	animation:confetti-pop 1.25s cubic-bezier(.16,.75,.3,1) var(--delay) both
}

@keyframes confetti-pop {
	0% {
		opacity:0;
		transform:translate(0,0) rotate(0)
	}
	12% {
		opacity:1
	}
	75% {
		opacity:1
	}
	100% {
		opacity:0;
		transform:translate(var(--x),var(--y)) rotate(var(--spin))
	}
}

@media(prefers-reduced-motion:reduce) {
	.hero.is-rolling #today-title,.confetti-piece {
		animation:none
	}
}

const viewStorageKey = 'whisky-liquor-view-v1';

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

// v1.29: weather recommendation (Tsukuba, Japan) and independent all-bottle shuffle.
// Open-Meteo current weather is public and requires no API key. No location permission.
const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast?latitude=36.0835&longitude=140.0764&current=temperature_2m,weather_code&timezone=Asia%2FTokyo';
let currentWeather = null;
const weatherLine = $('weather-line');
function weatherLabel(code) {
    if (code === 0) return '快晴';
    if ([1,2].includes(code)) return '晴れ';
    if (code === 3) return '曇り';
    if ([45,48].includes(code)) return '霧';
    if ([51,53,55,56,57].includes(code)) return '小雨';
    if ([61,63,65,66,67,80,81,82].includes(code)) return '雨';
    if ([71,73,75,77,85,86].includes(code)) return '雪';
    if ([95,96,99].includes(code)) return '雷雨';
    return '曇り';
}
function weatherScore(b) {
    if (!currentWeather) return 0;
    const temp = currentWeather.temperature;
    const code = currentWeather.code;
    const wet = [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code);
    const snowy = [71,73,75,77,85,86].includes(code);
    const cloudy = [3,45,48].includes(code);
    const flav = new Set(b.flavors || []), serve = new Set(b.serves || []);
    let score = 1;
    const add = (tags, amount) => tags.forEach(t => { if (flav.has(t)) score += amount; });
    if (temp >= 28) { add(['フルーティー','ハーブ'], 3); if (serve.has('ソーダ')) score += 3; }
    else if (temp >= 18) { add(['フルーティー','甘い'], 2); if (serve.has('ロック') || serve.has('ソーダ')) score += 2; }
    else if (temp < 10) { add(['甘い','スモーキー'], 3); if (serve.has('ストレート') || serve.has('お湯')) score += 2; }
    else { add(['ウッディー','甘い','スモーキー'], 2); if (serve.has('ストレート') || serve.has('ロック')) score += 2; }
    if (wet || snowy) add(['スモーキー','ウッディー'], 3);
    else if (cloudy) add(['ビター','ウッディー'], 2);
    else add(['フルーティー','ハーブ'], 2);

}
const lastWeatherBottleKey = 'whisky-liquor-last-weather-v130';
function pickWeather(exclude = null, avoidPrevious = false) {
    let pool = ownedItems();
    if (!pool.length) return null;
    if (pool.length > 1 && exclude) pool = pool.filter(b => b !== exclude);
    if (avoidPrevious && pool.length > 1) {
        let lastId = null;
        try { lastId = localStorage.getItem(lastWeatherBottleKey); } catch (_) {}
        if (lastId) {
            const alternatives = pool.filter(b => bottleId(b) !== lastId);
            if (alternatives.length) pool = alternatives;
        }
    }
    if (!currentWeather) return pool[Math.floor(Math.random() * pool.length)];
    const scored = pool.map(b => ({ b, weight: weatherScore(b) }));
    // Include all owned bottles; higher compatibility increases probability without excluding rarer types.
    const sum = scored.reduce((v, x) => v + x.weight, 0);
    let draw = Math.random() * sum;
    for (const row of scored) { draw -= row.weight; if (draw < 0) return row.b; }
    return scored[scored.length - 1].b;
}
const randomHistoryKey = 'whisky-liquor-all-shuffle-v129';
let randomHistory = [];
try { const stored = JSON.parse(localStorage.getItem(randomHistoryKey) || '[]'); if (Array.isArray(stored)) randomHistory = stored; } catch (_) {}
const bottleId = b => [b.name, b.category, b.distillery].join('|');
function pickAll() {
    const owned = ownedItems();
    if (!owned.length) return null;
    const ids = new Set(owned.map(bottleId));
    randomHistory = randomHistory.filter(id => ids.has(id));
    let pool = owned.filter(b => !randomHistory.includes(bottleId(b)) && (owned.length < 2 || b !== selectedBottle));
    if (!pool.length) {
        randomHistory = [];
        pool = owned.filter(b => owned.length < 2 || b !== selectedBottle);
    }
    const b = pool[Math.floor(Math.random() * pool.length)] || owned[0];
    randomHistory.push(bottleId(b));
    try { localStorage.setItem(randomHistoryKey, JSON.stringify(randomHistory)); } catch (_) {}
    return b;
}
// v1.31 beta: use the existing Excel flavor tags and owned bottles only.
// "Dry" is interpreted as bitter / maritime / woody rather than sweetness.
const moodProfiles = {
    smoky: { 'スモーキー': 5 },
    fruity: { 'フルーティー': 5 },
    fresh: { 'ハーブ': 5, 'フルーティー': 3, '潮': 2 },
    sweet: { '甘い': 5 },
    dry: { 'ビター': 5, '潮': 4, 'ウッディー': 2 }
};
const lastMoodKey = 'whisky-liquor-mood-history-v131';
let lastMood = {};
try { lastMood = JSON.parse(localStorage.getItem(lastMoodKey) || '{}') || {}; } catch (_) {}
function pickMood(mood) {
    const profile = moodProfiles[mood];
    if (!profile) return null;
    const candidates = ownedItems().map(b => {
        const tags = new Set(b.flavors || []);
        let weight = Object.entries(profile).reduce((total, [tag, point]) => total + (tags.has(tag) ? point : 0), 0);
        if (mood === 'fresh' && tags.has('スモーキー')) weight *= 0.45;
        if (mood === 'dry' && tags.has('甘い')) weight *= 0.5;
        return { b, weight };
    }).filter(x => x.weight > 0);
    if (!candidates.length) return null;
    const lastId = lastMood[mood];
    let pool = candidates.filter(x => bottleId(x.b) !== lastId && (candidates.length <= 1 || x.b !== selectedBottle));
    if (!pool.length) pool = candidates.filter(x => bottleId(x.b) !== lastId);
    if (!pool.length) pool = candidates;
    let draw = Math.random() * pool.reduce((sum, x) => sum + x.weight, 0);
    let chosen = pool[pool.length - 1].b;
    for (const row of pool) { draw -= row.weight; if (draw < 0) { chosen = row.b; break; } }
    lastMood[mood] = bottleId(chosen);
    try { localStorage.setItem(lastMoodKey, JSON.stringify(lastMood)); } catch (_) {}
    return chosen;
}
async function initWeatherRecommendation() {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 6000);
    try {
        const response = await fetch(WEATHER_URL, { signal: controller.signal, cache: 'no-store' });
        if (!response.ok) throw new Error('天気の取得に失敗');
        const data = await response.json();
        const temp = Number(data.current?.temperature_2m), code = Number(data.current?.weather_code);
        if (!Number.isFinite(temp) || !Number.isFinite(code)) throw new Error('天気データが不完全');
        currentWeather = { temperature: temp, code };
        weatherLine.textContent = `📍つくば · ${weatherLabel(code)} · ${Math.round(temp)}℃`;
        selectedBottle = pickWeather(null, true);
        if (selectedBottle) {
            try { localStorage.setItem(lastWeatherBottleKey, bottleId(selectedBottle)); } catch (_) {}
        }
        renderToday();
    } catch (_) {
        currentWeather = null;
        weatherLine.textContent = '📍つくば · 天気未取得';
        selectedBottle = pickWeather(null, true);
        if (selectedBottle) {
            try { localStorage.setItem(lastWeatherBottleKey, bottleId(selectedBottle)); } catch (_) {}
        }
        renderToday();
    } finally { clearTimeout(timeout); }
}
async function spinRecommendation(button, picker, label) {

        if (!reduced) {
            for (let step = 0; step < 18; step++) {
                $('today-title').textContent = items[Math.floor(Math.random() * items.length)].name;
                await sleep(38 + step * 8);
            }
        }
        selectedBottle = choice;
        if (button.id === 'weather-reco') {

}
$('weather-reco').addEventListener('click', () => spinRecommendation($('weather-reco'), () => pickWeather(selectedBottle), '🌤️ 天気で選ぶ'));
